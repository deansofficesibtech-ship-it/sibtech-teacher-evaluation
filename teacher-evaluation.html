<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Evaluation – Dean's Office</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1d2433;--paper:#f6f4ef;--card:#fff;--line:#d9d5c9;--navy:#23395b;--ok:#2d7a4f;--warn:#b7791f;--bad:#b3261e;--mut:#6b7280}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Georgia,'Times New Roman',serif;background:var(--paper);color:var(--ink)}
h1,h2,h3,button,input,select,textarea,table,.tab{font-family:system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
main{max-width:1100px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border:1px solid var(--line);background:#ece9df;cursor:pointer;border-radius:6px 6px 0 0}
.tab.on{background:var(--card);border-bottom-color:var(--card);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:6px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:#ece9df}td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#faf8f2}
button{padding:7px 14px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:4px;cursor:pointer}
button.alt{background:#fff;color:var(--navy)}button.del{background:#fff;color:var(--bad);border-color:var(--bad);padding:3px 8px}
input,select,textarea{padding:7px;border:1px solid var(--line);border-radius:4px;font-size:14px;max-width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.badge{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}
.flag td{background:#fdeceb}.mut{color:var(--mut);font-size:13px}
.sec{border:1px solid var(--line);padding:10px;margin:10px 0;border-radius:4px}.sec h3{margin:0 0 6px;font-size:15px}
.ind{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:3px 0}.ind input{width:70px}
#login{max-width:340px;margin:12vh auto}.hide{display:none}.msg{margin:8px 0;font-size:13px}
@media print{header,.tabs,button{display:none}}
</style></head><body>
<div id="login" class="card"><h2>Teacher Evaluation</h2><p class="mut">Dean's Office</p>
<label>Username</label><input id="lu" style="width:100%"><label>Password</label><input id="lp" type="password" style="width:100%">
<p><button onclick="doLogin()">Sign in</button></p><div id="lmsg" class="msg" style="color:var(--bad)"></div></div>

<div id="app" class="hide">
<header><h1>Teacher Evaluation <small style="font-weight:400;opacity:.7">v6</small></h1>
<div class="row" style="align-items:center"><span id="who"></span>
<select id="term" onchange="refresh()"></select>
<button class="alt" onclick="newTerm()" id="ntbtn">New term</button>
<button class="alt" onclick="logout()">Sign out</button></div></header>
<main><div class="tabs" id="tabs"></div><div id="view"></div></main></div>

<script>
// ====== SETUP: paste your Supabase project values ======
const SUPABASE_URL='https://lwciaprylzikjhfffkbx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3Y2lhcHJ5bHppa2poZmZma2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNDkwOTgsImV4cCI6MjExMDcyNTA5OH0.uOgmAWBK34wdqxMEfuxzc88ULwetgM91eM2Ha7FgmCc';
// ========================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SECTIONS=[
['Professional Responsibility',['The teacher starts and ends the class on time.','Attendance is accurately recorded.','The lesson plan/syllabus is available and properly followed.','Learning materials are prepared and well-organized.','Compliance with the Flexi Schedule Policy is observed.']],
['Instructional Delivery',['Learning objectives are clearly stated.','Content is accurate and aligned with the syllabus.','Teaching strategies are appropriate to the learning modality.','Explanations are clear, coherent, and well-structured.','Technology and instructional tools are effectively utilized (if applicable).']],
['Student Engagement and Classroom Management',['Students are actively engaged in learning activities.','The teacher encourages meaningful participation.','Classroom management strategies are effective.','A respectful and inclusive learning environment is maintained.','Student questions are addressed clearly and professionally.']],
['Assessment and Feedback',['Learning activities align with stated objectives.','Assessment methods are appropriate and relevant.','Instructions for tasks and assessments are clear.','Feedback provided is timely, constructive, and actionable.','Monitoring of student progress is evident.']],
['Onsite Classes',['Classroom setup is conducive to learning.','Instructional aids and materials are effectively utilized.','Safety, order, and discipline are properly maintained.']]];
const WEIGHTS={hr:0.30,dean:0.30,program_head:0.30,student:0.10}; // overall weights
const COMPLY=['Class conducted according to the approved schedule','Required contact hours completed','Required documentation submitted','Any deviations are properly documented and reported'];
const NONRENEWAL_MAX=85; // overall rating 85 and below = subject for non-renewal
let me=null,tab='rank',teachers=[],evals=[],detail=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>n==null?'–':Number(n).toFixed(2);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const BANDS=[[5,'Excellent','96-100'],[4,'Very Satisfactory','91-95'],[3,'Satisfactory','86-90'],[2,'Needs Improvement','75-85'],[1,'Unsatisfactory','70-74']];
function band(s){if(s>=96)return['Excellent','b-ok',5];if(s>=91)return['Very Satisfactory','b-ok',4];if(s>=86)return['Satisfactory','b-warn',3];if(s>=75)return['Needs Improvement','b-bad',2];return['Unsatisfactory','b-bad',1]}
// a 1-5 scale entry is converted to the middle of its band; 70-100 is used as is
function toScore(v){if(isNaN(v))return null;if(v>=70&&v<=100)return v;if(v>=1&&v<=5){const m=[72,80,88,93,98],i=Math.min(Math.floor(v)-1,3),f=v-1-i;return +(m[i]+(m[i+1]-m[i])*f).toFixed(2)}return null}
const isDean=()=>me&&me.role==='dean';

async function doLogin(){
 const {data,error}=await sb.from('eval_users').select('*').eq('username',$('lu').value.trim()).eq('password',$('lp').value).maybeSingle();
 if(error||!data){$('lmsg').textContent='Wrong username or password.';return}
 me=data;sessionStorage.setItem('te_user',JSON.stringify(me));start();
}
function logout(){sessionStorage.removeItem('te_user');location.reload()}
async function start(){
 $('login').classList.add('hide');$('app').classList.remove('hide');
 $('who').textContent=me.full_name||me.username;
 if(!isDean())$('ntbtn').classList.add('hide');
 const t=[['rank','Rankings']];if(isDean())t.push(['eval','Evaluate'],['csv','Import student CSV'],['teachers','Teachers'],['accts','Accounts']);
 $('tabs').innerHTML=t.map(x=>`<div class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';detail=null;start2()">${x[1]}</div>`).join('');
 await loadTerms();
}
function start2(){
 const t=[['rank','Rankings']];if(isDean())t.push(['eval','Evaluate'],['csv','Import student CSV'],['teachers','Teachers'],['accts','Accounts']);
 $('tabs').innerHTML=t.map(x=>`<div class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';detail=null;start2()">${x[1]}</div>`).join('');render();
}
async function loadTerms(){
 const {data}=await sb.from('evaluations').select('term');
 let terms=[...new Set((data||[]).map(r=>r.term))].sort().reverse();
 const keep=$('term').value;
 if(!terms.length)terms=['1st Sem 2026-2027'];
 $('term').innerHTML=terms.map(t=>`<option>${esc(t)}</option>`).join('');
 if(terms.includes(keep))$('term').value=keep;
 refresh();
}
function newTerm(){const t=prompt('Term name (e.g. 2nd Sem 2026-2027):');if(!t)return;
 const o=document.createElement('option');o.textContent=t;$('term').prepend(o);$('term').value=t;refresh()}
async function refresh(){
 const [a,b]=await Promise.all([sb.from('teachers').select('*').order('name'),sb.from('evaluations').select('*').eq('term',$('term').value)]);
 teachers=a.data||[];evals=b.data||[];start2();
}
function compute(){
 const rows=teachers.map(t=>{
  const ev=evals.filter(e=>e.teacher_id===t.id);
  const st=ev.filter(e=>e.source==='student').map(e=>+e.score);
  const dn=ev.filter(e=>e.source==='dean').map(e=>+e.score);
  const ph=ev.filter(e=>e.source==='program_head').map(e=>+e.score);
  const hh=ev.filter(e=>e.source==='hr').map(e=>+e.score);
  const s=avg(st),d=avg(dn),p=avg(ph),h=avg(hh);
  const comp=[['hr',h,'HR'],['dean',d,'Dean'],['program_head',p,'Program head'],['student',s,'Students']];
  const have=comp.filter(c=>c[1]!=null);
  const wsum=have.reduce((a,c)=>a+WEIGHTS[c[0]],0);
  const overall=have.length?have.reduce((a,c)=>a+c[1]*WEIGHTS[c[0]],0)/wsum:null;
  return{t,s,d,p,h,n:st.length,overall,missing:comp.filter(c=>c[1]==null).map(c=>c[2])};
 }).filter(r=>r.overall!=null);
 rows.sort((x,y)=>y.overall-x.overall);
 let rank=0,prev=null;rows.forEach((r,i)=>{if(prev===null||r.overall.toFixed(2)!==prev){rank=i+1;prev=r.overall.toFixed(2)}r.rank=rank});
 return rows;
}
function render(){
 if(tab==='rank')return renderRank();
 if(tab==='eval')return renderEval();
 if(tab==='csv')return renderCsv();
 if(tab==='teachers')return renderTeachers();
 if(tab==='accts')return renderAccts();
}
function renderRank(){
 const rows=compute();
 let h=`<div class="card"><div class="mut">Overall = HR 30% + Dean 30% + Program head 30% + Students 10%. Overall below ${NONRENEWAL_MAX+1} (the 75–85 band and lower) is flagged for non-renewal, but only once all four ratings are in; until then the row shows Incomplete and the overall is computed from the ratings available. Click a row for details.</div></div>
 <div class="card" style="overflow-x:auto"><table><tr><th>Rank</th><th>Teacher</th><th>Program</th><th>HR (30%)</th><th>Dean (30%)</th><th>Program head (30%)</th><th>Students (10%)</th><th>Overall</th><th>Rating</th><th>Status</th></tr>`;
 if(!rows.length)h+=`<tr><td colspan="11" class="mut">No evaluations for this term yet.${isDean()?' Import a student CSV or add an evaluation.':''}</td></tr>`;
 rows.forEach(r=>{const [lbl,cls,num]=band(r.overall),complete=!r.missing.length,flag=complete&&r.overall<NONRENEWAL_MAX+1;
  h+=`<tr class="click ${flag?'flag':''}" onclick="detail='${r.t.id}';renderRank()"><td>${r.rank}</td><td>${esc(r.t.name)}</td><td>${esc(r.t.program)}</td>
  <td class="n">${f2(r.h)}</td><td class="n">${f2(r.d)}</td><td class="n">${f2(r.p)}</td><td class="n">${f2(r.s)} <span class="mut">(${r.n})</span></td><td class="n"><b>${f2(r.overall)}</b></td>
  <td><span class="badge ${cls}">${num} – ${lbl}</span></td><td>${!complete?`<span class="badge" style="background:#6b7280">Incomplete</span> <span class="mut">needs ${r.missing.join(', ')}</span>`:flag?'<span class="badge b-bad">For non-renewal</span>':'Retain'}</td></tr>`});
 h+='</table></div>';
 if(detail){const t=teachers.find(x=>x.id===detail);const ev=evals.filter(e=>e.teacher_id===detail&&e.source!=='student');
  const sn=evals.filter(e=>e.teacher_id===detail&&e.source==='student').length;
  h+=`<div class="card"><h3>${esc(t.name)} – details</h3><div class="mut">${sn} student evaluation(s) this term.</div>`;
  if(!ev.length)h+='<p class="mut">No HR, dean or program head evaluation yet.</p>';
  ev.forEach(e=>{const d=e.details||{};
   h+=`<div class="sec"><h3>${({dean:'Dean',program_head:'Program head',hr:'HR'})[e.source]}${d.evaluator?' ('+esc(d.evaluator)+')':''} – ${f2(e.score)} <span class="mut">${esc(d.subject||'')} ${esc(d.date||'')}</span> ${isDean()?`<button class="del" onclick="delEval('${e.id}')">Delete</button>`:''}</h3>`;
   if(d.sections)h+=SECTIONS.map((s,i)=>`<div class="ind"><span>${s[0]}</span><b>${f2(d.sections[i])}</b></div>`).join('');
   const bb=band(+e.score);h+=`<div class="ind"><span><b>Overall category</b></span><b>${bb[2]} – ${bb[0]}</b></div>`;
   if(e.remarks)h+=`<p><b>Strengths observed:</b> ${esc(e.remarks)}</p>`;
   if(d.improve)h+=`<p><b>Areas for improvement:</b> ${esc(d.improve)}</p>`;
   if(d.plan)h+=`<p><b>Recommended action plan / intervention:</b> ${esc(d.plan)}</p>`;
   if(d.comply)h+=`<p><b>Compliance check:</b><br>${COMPLY.map((c,i)=>(d.comply[i]?'&#9745; ':'&#9744; ')+c).join('<br>')}${d.comply_remarks?'<br><i>'+esc(d.comply_remarks)+'</i>':''}</p>`;
   if(d.signed||d.acked)h+=`<p class="mut">Evaluator signed: ${esc(d.signed||'–')} &nbsp; Teacher acknowledgment: ${d.acked?'&#9745; acknowledged '+esc(d.ack_date||''):'&#9744; not yet'}</p>`;
   h+='</div>'});
  h+='<button class="alt" onclick="window.print()">Print</button></div>';}
 $('view').innerHTML=h;
}
async function delEval(id){if(!confirm('Delete this evaluation? You can re-enter it afterwards.'))return;await sb.from('evaluations').delete().eq('id',id);refresh()}
function renderEval(){
 let h=`<div class="card"><h3>Add HR, dean or program head evaluation</h3>
 <div class="row"><div><label>Teacher</label><input id="et" list="tl" placeholder="Type or pick a name"><datalist id="tl">${teachers.map(t=>`<option value="${esc(t.name)}">`).join('')}</datalist></div>
 <div><label>Program</label><input id="ep" placeholder="e.g. BSHM"></div>
 <div><label>Course / subject</label><input id="es"></div>
 <div><label>Date</label><input id="ed" type="date"></div>
 <div><label>Evaluated by</label><select id="eb" onchange="evWho()"><option value="dean">Dean</option><option value="program_head">Program head</option><option value="hr">HR</option></select></div>
 <div id="evw"><label>Program head (choose when Evaluated by = Program head)</label><select id="evn" disabled><option value="">-- choose program head --</option>${teachers.filter(t=>/program head/i.test(t.program||'')).map(t=>`<option value="${esc(t.name)}">${esc(t.name)} (${esc(t.program)})</option>`).join('')}</select></div></div>
 <p class="mut">Rate each indicator 70–100, or use the 1–5 scale (5 = 96–100, 4 = 91–95, 3 = 86–90, 2 = 75–85, 1 = 70–74; a 1–5 entry is converted to the middle of its band). Leave blank for N/A. Section totals, the overall rating and its category are computed automatically.</p>`;
 SECTIONS.forEach((s,i)=>{h+=`<div class="sec"><h3>${s[0]} <span class="mut" id="st${i}"></span></h3>`+s[1].map((q,j)=>`<div class="ind"><span>${q}</span><input type="number" min="1" max="100" step="any" data-s="${i}" oninput="calcForm()"></div>`).join('')+'</div>'});
 h+=`<h3 style="margin-top:18px">Part II: Summary of observation</h3>
 <label>Strengths observed</label><textarea id="er" rows="3" style="width:100%"></textarea>
 <label>Areas for improvement</label><textarea id="ea" rows="3" style="width:100%"></textarea>
 <label>Recommended action plan / intervention</label><textarea id="eap" rows="3" style="width:100%"></textarea>
 <h3 style="margin-top:18px">Part III: Compliance check (Flexi Schedule Policy)</h3>
 ${COMPLY.map((c,i)=>`<div class="ind" style="justify-content:flex-start"><input type="checkbox" id="ec${i}" style="width:auto"><label style="margin:0;color:inherit;font-size:15px" for="ec${i}">${c}</label></div>`).join('')}
 <label>Compliance remarks</label><textarea id="ecr" rows="2" style="width:100%"></textarea>
 <h3 style="margin-top:18px">Part IV: Overall performance rating</h3>
 <p><b>Overall rating: <span id="eo">–</span></b></p><div id="ecat" class="mut" style="font-size:14px"></div>
 <div class="row"><div><label>Evaluator signed on</label><input id="esd" type="date"></div>
 <div><label>Teacher acknowledgment</label><label style="color:inherit;font-size:14px;margin:0"><input type="checkbox" id="eak" style="width:auto"> Teacher acknowledged</label></div>
 <div><label>Acknowledged on</label><input id="ead" type="date"></div></div>
 <p><button onclick="saveEval()">Save evaluation</button></p><div id="emsg" class="msg"></div></div>`;
 calcForm();
 $('view').innerHTML=h;
}
function evWho(){const on=$('eb').value==='program_head';$('evn').disabled=!on;if(!on)$('evn').value=''}
function calcForm(){
 const secs=SECTIONS.map((_,i)=>avg([...document.querySelectorAll(`input[data-s="${i}"]`)].map(x=>x.value).filter(v=>v!=='').map(v=>toScore(+v)).filter(v=>v!=null)));
 secs.forEach((v,i)=>$('st'+i).textContent=v==null?'':'Total: '+f2(v));
 const o=avg(secs.filter(x=>x!=null));
 const b=o==null?null:band(o);
 $('eo').textContent=o==null?'–':f2(o)+' – '+b[2]+' ('+b[0]+')';
 $('ecat').innerHTML=BANDS.map(x=>`${b&&b[2]===x[0]?'&#9745;':'&#9744;'} ${x[0]} – ${x[1]} (${x[2]})`).join(' &nbsp; ');
 return{secs,o};
}
async function ensureTeacher(name,prog){
 name=name.trim();let t=teachers.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(t){if(prog&&!t.program){await sb.from('teachers').update({program:prog}).eq('id',t.id)}return t.id}
 const {data,error}=await sb.from('teachers').insert({name,program:prog||''}).select().single();
 if(error)throw error;teachers.push(data);return data.id;
}
async function saveEval(){
 const name=$('et').value.trim();const {secs,o}=calcForm();
 if(!name||o==null){$('emsg').textContent='Enter a teacher and at least one rating.';return}
 const inputs=[...document.querySelectorAll('input[data-s]')].map(x=>x.value).filter(v=>v!=='').map(Number);
 if(inputs.some(v=>toScore(v)==null)){$('emsg').textContent='Ratings must be 70-100, or 1-5 on the scale.';return}
 const evn=$('evn').value.trim();
 if($('eb').value==='program_head'){if(!evn){$('emsg').textContent='Choose the program head who evaluated.';return}
}
 try{const id=await ensureTeacher(name,$('ep').value.trim());
  const {error}=await sb.from('evaluations').insert({teacher_id:id,term:$('term').value,source:$('eb').value,score:+o.toFixed(2),remarks:$('er').value,details:{sections:secs,subject:$('es').value,date:$('ed').value,evaluator:$('eb').value==='program_head'?evn:'',improve:$('ea').value,plan:$('eap').value,comply:COMPLY.map((_,i)=>$('ec'+i).checked),comply_remarks:$('ecr').value,signed:$('esd').value,acked:$('eak').checked,ack_date:$('ead').value}});
  if(error)throw error;$('emsg').textContent='Saved.';await refresh();tab='eval';start2();
 }catch(e){$('emsg').textContent='Could not save: '+e.message}
}
function renderCsv(){
 $('view').innerHTML=`<div class="card"><h3>Import student evaluations</h3>
 <p class="mut">CSV with a header row. Required columns: <b>teacher</b> and <b>rating</b> (70–100, or 1–5 on the scale, one row per student; 5 = 96–100, 4 = 91–95, 3 = 86–90, 2 = 75–85, 1 = 70–74). Optional: <b>program</b>. New teachers are created automatically. Rows are added to the selected term (<b>${esc($('term').value)}</b>).</p>
 <input type="file" id="cf" accept=".csv"> <button onclick="importCsv()">Import</button>
 <div class="msg" id="cm"></div></div>`;
}
function parseCsv(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
async function importCsv(){
 const f=$('cf').files[0];if(!f){$('cm').textContent='Choose a CSV file first.';return}
 const rows=parseCsv((await f.text()).replace(/^\uFEFF/,''));const head=rows.shift().map(x=>x.trim().toLowerCase());
 const ti=head.indexOf('teacher'),ri=head.findIndex(h=>h==='rating'||h==='score'),pi=head.indexOf('program');
 if(ti<0||ri<0){$('cm').textContent='Header must include "teacher" and "rating".';return}
 const out=[];let bad=0;const ids={};
 try{for(const r of rows){const name=(r[ti]||'').trim(),v=parseFloat(r[ri]);
   const sc=toScore(v);if(!name||sc==null){bad++;continue}
   if(!ids[name.toLowerCase()])ids[name.toLowerCase()]=await ensureTeacher(name,pi>=0?(r[pi]||'').trim():'');
   out.push({teacher_id:ids[name.toLowerCase()],term:$('term').value,source:'student',score:sc})}
  for(let i=0;i<out.length;i+=500){const {error}=await sb.from('evaluations').insert(out.slice(i,i+500));if(error)throw error}
  $('cm').textContent=`Imported ${out.length} student rating(s). Skipped ${bad} invalid row(s).`;await refresh();tab='csv';start2();$('cm').textContent=`Imported ${out.length} student rating(s). Skipped ${bad} invalid row(s).`;
 }catch(e){$('cm').textContent='Import failed: '+e.message}
}

function renderTeachers(){
 $('view').innerHTML=`<div class="card"><h3>Add teachers and programs</h3>
 <p class="mut">Upload a CSV with columns <b>name</b> and <b>program</b>, or paste rows copied from Excel / Google Sheets (name in the first column, program in the second). Existing teachers just get their program updated.</p>
 <input type="file" id="tf" accept=".csv"> <button onclick="importTeachers(true)">Import file</button>
 <label>Or paste here</label><textarea id="tp" rows="6" style="width:100%" placeholder="Jatulan, Mary Joy[TAB]BSHM"></textarea>
 <p><button onclick="importTeachers(false)">Import pasted rows</button></p><div class="msg" id="tm"></div></div>
 <div class="card" style="overflow-x:auto"><h3>Teachers (${teachers.length})</h3><table><tr><th>Name</th><th>Program</th><th></th></tr>
 ${teachers.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.program)}</td><td><button class="alt" onclick="editProg('${t.id}')">Edit program</button> <button class="del" onclick="delTeacher('${t.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="3" class="mut">No teachers yet.</td></tr>'}</table></div>`;
}
async function importTeachers(f){
 if(window._imp){$('tm').textContent='Import still running - please wait.';return}
 window._imp=true;$('tm').textContent='Importing... please wait and do not click again.';
 try{await _importTeachers(f)}finally{window._imp=false}
}
async function _importTeachers(fromFile){
 let text;if(fromFile){const f=$('tf').files[0];if(!f){$('tm').textContent='Choose a CSV file first.';return}text=await f.text()}else text=$('tp').value;
 text=text.replace(/^\uFEFF/,'');if(!text.trim()){$('tm').textContent='Nothing to import.';return}
 let rows=text.includes('\t')?text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t')):parseCsv(text);
 if(rows.length&&/^(name|teacher|teacher name|faculty)$/i.test((rows[0][0]||'').trim()))rows.shift();
 const seen={};let add=0,upd=0;
 try{for(const r of rows){const name=(r[0]||'').trim(),prog=(r[1]||'').trim();if(!name||seen[name.toLowerCase()])continue;seen[name.toLowerCase()]=1;
   const t=teachers.find(x=>x.name.toLowerCase()===name.toLowerCase());
   if(t){if(prog&&t.program!==prog){const {error}=await sb.from('teachers').update({program:prog}).eq('id',t.id);if(error)throw error;upd++}}
   else{const {data,error}=await sb.from('teachers').insert({name,program:prog}).select().single();if(error)throw error;teachers.push(data);add++}}
  await refresh();tab='teachers';start2();$('tm').textContent=`Added ${add} new teacher(s), updated ${upd}.`;
 }catch(e){$('tm').textContent='Import failed: '+e.message}
}
async function editProg(id){const t=teachers.find(x=>x.id===id);const v=prompt('Program for '+t.name+':',t.program||'');if(v===null)return;await sb.from('teachers').update({program:v.trim()}).eq('id',id);await refresh();tab='teachers';start2()}
async function delTeacher(id){const t=teachers.find(x=>x.id===id);if(!confirm('Delete '+t.name+' and ALL of their evaluations (every term)?'))return;await sb.from('teachers').delete().eq('id',id);await refresh();tab='teachers';start2()}
async function renderAccts(){
 const {data}=await sb.from('eval_users').select('*').order('username');
 $('view').innerHTML=`<div class="card"><h3>Create a view-only account</h3><div class="row">
 <div><label>Name</label><input id="an"></div><div><label>Username</label><input id="au"></div><div><label>Password</label><input id="ap"></div>
 <button onclick="addAcct()">Create account</button></div><div class="msg" id="am"></div></div>
 <div class="card"><table><tr><th>Name</th><th>Username</th><th>Password</th><th>Role</th><th></th></tr>${(data||[]).map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td>${esc(u.password)}</td><td>${u.role==='dean'?'Dean\'s Office':'View only'}</td><td>${u.role==='viewer'?`<button class="del" onclick="delAcct('${u.id}')">Delete</button>`:''}</td></tr>`).join('')}</table></div>`;
}
async function addAcct(){
 const u=$('au').value.trim(),p=$('ap').value;if(!u||!p){$('am').textContent='Username and password are required.';return}
 const {error}=await sb.from('eval_users').insert({username:u,password:p,full_name:$('an').value.trim(),role:'viewer'});
 if(error){$('am').textContent='Could not create: '+error.message;return}renderAccts();
}
async function delAcct(id){if(!confirm('Delete this account?'))return;await sb.from('eval_users').delete().eq('id',id);renderAccts()}
const saved=sessionStorage.getItem('te_user');if(saved){me=JSON.parse(saved);start()}
</script></body></html>
