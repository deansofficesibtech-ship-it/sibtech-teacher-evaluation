*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
main{max-width:1000px;margin:0 auto;padding:14px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
nav button.on,.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.s{padding:3px 8px;font-size:13px}.btn.d{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}h2{margin:0 0 10px;font-size:17px}h3{margin:12px 0 6px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:24px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}th{color:var(--mut);white-space:nowrap}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}textarea{width:100%;min-height:80px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;border:1px solid var(--bd);color:var(--mut)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.banner{background:linear-gradient(90deg,#b8860b,#e0a82e);color:#1b1400;border-radius:12px;padding:14px;margin-bottom:14px;font-weight:600}
.bar{height:12px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pin{border-left:4px solid var(--warn)}.flash{background:var(--card);border:1px solid var(--ok);border-radius:8px;padding:8px 12px;margin-bottom:12px}
#login{max-width:340px;margin:40px auto}#login input{width:100%;margin-bottom:8px}
#pfw{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:16px;z-index:50}

.box{border:1px solid #666;padding:10px;margin-top:10px;min-height:90px}
@media print{body>*:not(#pfw){display:none!important}#pfw{display:block!important;position:static;background:none;padding:0}.noprint{display:none!important}}

 const [st,su,rq,gr,po,ho,se,pr,ft,rm,ta,asg,cl,ab,dlr]=await Promise.all(T.map(allRows));

 return`<div class="card"><h2>Enrollment summary — ${esc(S.term)}</h2><div class="grid"><div class="stat"><b>${S.students.length}</b>Total students</div><div class="stat"><b>${en}</b>Enrolled</div><div class="stat"><b>${pend}</b>Pending</div>${STAT.map(k=>`<div class="stat"><b>${c(k)}</b>${k}</div>`).join('')}</div>
 <div class="row"><input id="sn" value="${esc(S.school)}"><input id="tm" value="${esc(S.term)}"><button class="btn" onclick="go(sb.from('settings').update({school:$('#sn').value,term:$('#tm').value}).eq('id',1))">Save school / term</button></div></div>
 <div class="card"><h2>Staff accounts</h2><p class="mut">Create logins for faculty, finance, dean's office or other registrars. Staff sign in with the username and password you set here.</p>

async function setEnr(id,on){if(on&&!(stu(id)||{}).cleared&&!confirm('This student is not marked Finance cleared yet. Tag as enrolled anyway?')){render();return}await sb.from('students').update({enrolled:on}).eq('id',id);if(S.req[id])await sb.from('requests').update({status:on?'enrolled':'pending'}).eq('student_id',id);await load();render()}

V.registrar_Students=()=>`<div class="card"><h2>Students</h2>
 <div class="row"><input id="ni" placeholder="Student ID"><input id="nn" placeholder="Full name"><input id="nc" placeholder="Course" size="8"><select id="ny"><option>1</option><option>2</option><option>3</option><option>4</option></select><input id="nt" inputmode="decimal" placeholder="Tuition ₱" style="width:120px;text-align:right" onchange="this.value=fmt(pa(this.value))"><button class="btn p" onclick="addStu()">Add</button></div>

 <div class="row">Max students per block: <input type="number" value="${blkSize}" style="width:80px" onchange="blkSize=+this.value||40;render()"></div>
 <div class="scroll"><table><tr><th>Program</th><th>Major</th><th>Year</th><th>Curr.</th><th>Students</th><th>Blocks</th><th></th></tr>${G.map((g,i)=>{const cnt={};g.st.forEach(s=>{const b=s.block||'none';cnt[b]=(cnt[b]||0)+1});

async function sectionGroup(i,mode){const g=groups()[i];if(!g)return;const st=[...g.st],size=Math.max(5,+blkSize||40),items=[];
 if(mode=='shuffle'){if(g.year>2)return alert('3rd and 4th year blocks are not shuffled.');if(!confirm('Re-section '+st.length+' students at random? Their current blocks will be replaced.'))return;
  for(let a=st.length-1;a>0;a--){const j=Math.floor(Math.random()*(a+1));[st[a],st[j]]=[st[j],st[a]]}
  const k=Math.ceil(st.length/size),base=Math.floor(st.length/k),extra=st.length%k;let p=0;for(let b=0;b<k;b++){const n=base+(b<extra?1:0);for(let c=0;c<n;c++)items.push({id:st[p++].id,block:LET(b)})}
 }else{const cnt={};st.filter(s=>s.block).forEach(s=>cnt[s.block]=(cnt[s.block]||0)+1);
  st.filter(s=>!s.block).sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{let b=Object.keys(cnt).filter(x=>cnt[x]<size).sort((x,y)=>cnt[x]-cnt[y])[0];if(!b){b=LET(Object.keys(cnt).length);cnt[b]=0}cnt[b]++;items.push({id:s.id,block:b})})}
 if(!items.length)return alert('Everyone in this group already has a block.');

const nk=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const tcase=s=>String(s).toLowerCase().replace(/(^|[\s,.\-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const DOWS=['MON','TUE','WED','THU','FRI','SAT'];
function parseDaysTxt(t){const set=new Set();let u=String(t).toUpperCase();
 u=u.replace(/\b(MON|TUE|WED|THU|FRI|SAT)[A-Z]*\s*-\s*(MON|TUE|WED|THU|FRI|SAT)[A-Z]*/g,(m,a,b)=>{for(let k=DOWS.indexOf(a);k<=DOWS.indexOf(b);k++)set.add(k);return' '});
 (u.match(/\b(MON|TUE|WED|THU|FRI|SAT)[A-Z]*/g)||[]).forEach(x=>set.add(DOWS.indexOf(x.slice(0,3))));return[...set].sort()}
function parseTimeTxt(t){const m=String(t).toUpperCase().match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?\s*-\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/);if(!m)return null;
 const h24=(h,mi,ap)=>((+h%12)+(ap=='PM'?12:0))*60+(+mi||0),end=h24(m[4],m[5],m[6]);let start;
 if(m[3])start=h24(m[1],m[2],m[3]);else{const am=h24(m[1],m[2],'AM'),pm=h24(m[1],m[2],'PM'),c=[am,pm].filter(x=>x<end).sort((a,b)=>(end-a)-(end-b));start=c.length?c[0]:am}
 return[start,end]}
const mergeW=a=>{a=[...a].sort((x,y)=>x[0]-y[0]);const o=[];a.forEach(w=>{const l=o[o.length-1];if(l&&w[0]<=l[1])l[1]=Math.max(l[1],w[1]);else o.push([...w])});return o};
const subW=(base,cuts)=>{let r=base.map(w=>[...w]);cuts.forEach(c=>{const n=[];r.forEach(w=>{if(c[1]<=w[0]||c[0]>=w[1])n.push(w);else{if(c[0]>w[0])n.push([w[0],c[0]]);if(c[1]<w[1])n.push([c[1],w[1]])}});r=n});return r.filter(w=>w[1]-w[0]>0)};
function buildAvail(remarks){const only=DOWS.map(()=>[]),not=DOWS.map(()=>[]);let hasOnly=false;
 remarks.forEach(r=>{const u=String(r).toUpperCase(),isNot=/NOT\s+AVAILABLE/.test(u),isOnly=/ONLY\s+AVAILABLE/.test(u);if(!isNot&&!isOnly)return;
  let days=parseDaysTxt(u.replace(/NOT\s+AVAILABLE|ONLY\s+AVAILABLE/,''));if(!days.length)days=[0,1,2,3,4,5];const w=parseTimeTxt(u)||[450,1140];
  days.forEach(d=>(isOnly?only:not)[d].push(w));if(isOnly)hasOnly=true});
 const out={};DOWS.forEach((_,d)=>{let base=hasOnly?mergeW(only[d]):[[450,1140]];base=subW(base,not[d]);out[DAYS6[d]]={on:base.length>0,win:base.map(w=>[tm(w[0]),tm(w[1])])}});return out}
const winTxt=x=>winsOf(x||{}).map(w=>w[0]+'-'+w[1]).join(', ');
const parseWin=t=>String(t||'').split(',').map(z=>z.trim()).filter(Boolean).map(z=>{const m=z.match(/(\d{1,2}):?(\d{2})?\s*-\s*(\d{1,2}):?(\d{2})?/);return m?[tm((+m[1])*60+(+m[2]||0)),tm((+m[3])*60+(+m[4]||0))]:null}).filter(Boolean);
const majorKey=m=>{m=String(m||'').trim().toUpperCase();if(!m||/^N\/?A$/.test(m))return'';if(!/\s/.test(m)&&m.length<=5)return m;return m.split(/\s+/).filter(w=>!['OF','IN','AND','&'].includes(w)).map(w=>w[0]).join('')};
const isLetterBlock=b=>/^[A-Z]\d?$/i.test(String(b||''));
const blockHas=(s,b)=>isLetterBlock(b)?String(s.block||'').toUpperCase()==String(b).toUpperCase():String(b).toUpperCase().split('/').includes(majorKey(s.major));
const keysOf=(p,y,b)=>isLetterBlock(b)?[`${p}|${y}|B:${String(b).toUpperCase()}`]:String(b).toUpperCase().split('/').map(t=>`${p}|${y}|M:${t}`);

function mkUser(n,used){const T=['DR','ENGR','MR','MS','MRS','PROF','ATTY'],raw=String(n).includes(',');let last,first;

const DL_MAX=1.75,DL_WORST=2;
function dlEval(s){const r={ok:false,reasons:[],label:'',year:0,tgpa:null,rows:[]};
 if(s.status!='regular')r.reasons.push(s.status=='drop'?'Dropped':'Not a regular student ('+s.status+')');
 const g=S.gr[s.id]||{},pg=(s.course||'').trim(),has=v=>v!==undefined&&v!=='';
 const need=S.subj.filter(x=>x.curriculum==s.curriculum&&(x.program||'').trim()==pg&&x.year_level>0&&(NA(x.major)||!s.major||NA(s.major)||x.major==s.major)),blocks=new Map();
 need.forEach(x=>{const k=x.year_level*10+Math.max(0,SEM.indexOf(x.semester)),b=blocks.get(k)||blocks.set(k,{label:`Year ${x.year_level} · ${x.semester}`,m:new Map()}).get(k);if(!b.m.has(x.code))b.m.set(x.code,x)});
 const ks=[...blocks.keys()].filter(k=>[...blocks.get(k).m.keys()].some(c=>has(g[c]))).sort((a,b)=>b-a);
 if(!ks.length){r.reasons.push('No grades on record');return r}
 const b=blocks.get(ks[0]);r.label=b.label;r.year=Math.floor(ks[0]/10);let u=0,t=0;
 b.m.forEach((x,c)=>{const v=g[c];r.rows.push({code:c,title:x.title,units:x.units,grade:has(v)?v:''});
  if(!has(v)){r.reasons.push('No grade yet for '+c);return}
  const U=String(v).toUpperCase();if(U=='WP')return;
  if(U=='INC'||U=='NFE'){r.reasons.push('Unresolved '+U+' in '+c);return}
  if(U=='DRP'){r.reasons.push('Dropped or withdrawn subject '+c);return}
  if(!num(v)){r.reasons.push('Unrecognized grade "'+v+'" in '+c);return}
  if(+v>=5){r.reasons.push('Failing grade in '+c);return}
  if(+v>DL_WORST)r.reasons.push('Grade lower than 2.00 in '+c+' ('+v+')');
  if(+x.units>0){u+=+x.units;t+=v*x.units}});
 if(u>0)r.tgpa=t/u;
 if(r.tgpa===null)r.reasons.push('No numeric grades to compute the TGPA');else if(r.tgpa>DL_MAX)r.reasons.push('TGPA '+r.tgpa.toFixed(3)+' is above 1.75');
 r.ok=r.reasons.length==0;return r}

const setPays=(id,ps)=>go(sb.from('students').update({payments:ps,paid:ps.reduce((x,p)=>x+(+p.amount||0),0)}).eq('id',id));
async function addPay(id){const amt=pa($('#payamt').value);if(!(amt>0))return alert('Enter an amount.');
 setPays(id,[...(stu(id).payments||[]),{id:Date.now(),date:new Date().toISOString().slice(0,10),amount:amt,type:$('#paytype').value,or:$('#payor').value.trim(),note:$('#paynote').value.trim()}])}
function delPay(id,pid){if(confirm('Delete this payment record?'))setPays(id,(stu(id).payments||[]).filter(p=>p.id!=pid))}
function finList(){const q=finQ.trim().toLowerCase();let l=S.students.filter(s=>!q||[s.id,s.name,s.course].join(' ').toLowerCase().includes(q));const n=l.length;l=l.slice(0,50);
 return`<p class="mut">${q?n+' match(es)':'Type to search. Showing the first 50 of '+n}</p><div class="scroll"><table><tr><th>Student</th><th>Assessed</th><th>Paid</th><th>Balance</th><th>Cleared</th></tr>${l.map(s=>`<tr style="cursor:pointer" onclick="finSel='${s.id}';render()"><td>${esc(s.name)}<br><span class="mut">${esc(s.id)} · ${esc(s.course)}</span></td><td>${fmt(s.tuition)}</td><td>${fmt(s.paid)}</td><td>${fmt(bal(s))}</td><td>${s.cleared?'<span class="ok">Yes</span>':'—'}</td></tr>`).join('')}</table></div>`}
const drawFin=()=>{const e=$('#fres');if(e)e.innerHTML=finList()};
V.finance_Payments=()=>finSel&&stu(finSel)?finDetail(stu(finSel)):`<div class="card"><h2>Payments (collected at the Finance Office)</h2><div class="row"><input id="fq" value="${esc(finQ)}" placeholder="Search name, ID or program…" style="flex:1;min-width:220px" oninput="finQ=this.value;drawFin()"></div><div id="fres">${finList()}</div></div>`;
function finDetail(s){const id=s.id,a=asm(s),tot=totA(a),paid=paidOf(s),ps=s.payments||[];
 return`<p><button class="btn" onclick="finSel=null;render()">← Back to list</button></p>
 <div class="card"><h2>${esc(s.name)}</h2><p class="mut">${esc(s.id)} · ${esc(s.course)} · Year ${s.year}</p><label><input type="checkbox" ${s.cleared?'checked':''} onchange="go(sb.from('students').update({cleared:this.checked}).eq('id','${id}'))"> Finance cleared</label></div>
 <div class="card"><h2>Fees assessed</h2><div class="scroll"><table><tr><th>Fee</th><th>Amount (₱)</th><th></th></tr>${a.items.map((i,k)=>`<tr><td><input value="${esc(i.name)}" onchange="mod('${id}',a=>a.items[${k}].name=this.value)"></td><td>${amtIn(i.amount,`mod('${id}',a=>a.items[${k}].amount=pa(this.value))`)}</td><td><button class="btn s d" onclick="mod('${id}',a=>a.items.splice(${k},1))">✕</button></td></tr>`).join('')||'<tr><td colspan="3" class="mut">No fees yet. Load the default fees or add one.</td></tr>'}<tr><td><b>Total assessed</b></td><td style="text-align:right"><b>${fmt(tot)}</b></td><td></td></tr></table></div>
 <div class="row"><button class="btn s" onclick="mod('${id}',a=>a.items.push({name:'New fee',amount:0}))">+ Add fee</button><button class="btn s" onclick="if(confirm('Replace this list with the default fees?'))mod('${id}',a=>a.items=S.tpl.map(x=>({...x})))">Load default fees</button><button class="btn s" onclick="saveTpl('${id}')">Save these as the default fees</button></div>
 <h3>Down payment</h3><div class="row">${amtIn(a.down,`mod('${id}',a=>a.down=pa(this.value))`)} <span class="mut">Quick:</span>${[20,30,50].map(p=>`<button class="btn s" onclick="mod('${id}',a=>a.down=Math.round(totA(a)*${p})/100)">${p}%</button>`).join('')}</div>
 <p>Down payment <b>${fmt(a.down)}</b> · Remaining after down payment <b>${fmt(Math.max(0,tot-a.down))}</b> ${a.down>0?(paid>=a.down?'<span class="ok">· Down payment met</span>':`<span class="warn">· ${fmt(a.down-paid)} still needed for the down payment</span>`):''}</p></div>
 <div class="card"><h2>Payments</h2><div class="row"><input id="payamt" inputmode="decimal" placeholder="Amount" style="width:120px;text-align:right" onchange="this.value=fmt(pa(this.value))"><select id="paytype"><option>Down payment</option><option>Installment</option><option>Full payment</option></select><input id="payor" placeholder="OR no." size="8"><input id="paynote" placeholder="Note" size="14"><button class="btn p" onclick="addPay('${id}')">Record payment</button></div>
 <div class="scroll"><table><tr><th>Date</th><th>OR no.</th><th>Type</th><th>Note</th><th style="text-align:right">Amount</th><th></th></tr>${ps.map(p=>`<tr><td>${p.date}</td><td>${esc(p.or)}</td><td>${esc(p.type)}</td><td>${esc(p.note)}</td><td style="text-align:right">${fmt(p.amount)}</td><td><button class="btn s" onclick="printReceipt('${id}',${p.id})">Print receipt</button> <button class="btn s d" onclick="delPay('${id}',${p.id})">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="mut">No payments yet.</td></tr>'}<tr><td colspan="4"><b>Total paid</b></td><td style="text-align:right"><b>${fmt(paid)}</b></td><td></td></tr><tr><td colspan="4"><b>Balance</b></td><td style="text-align:right"><b>${fmt(Math.max(0,tot-paid))}</b></td><td></td></tr></table></div>
 <div class="row"><button class="btn" onclick="printReceipt('${id}',null)">Print statement of account</button></div></div>`}
function printReceipt(id,pid){const s=stu(id),a=asm(s),ps=s.payments||[],tot=totA(a),paid=paidOf(s);
 $('#pfw').style.display='block';$('#pfw').innerHTML=`<div class="noprint" style="max-width:760px;margin:0 auto 10px"><button class="btn p" onclick="window.print()">Print</button> <button class="btn" onclick="$('#pfw').style.display='none'">Close</button></div>
 <div class="pf"><h2 style="text-align:center;margin:0">${esc(S.school)}</h2><p style="text-align:center;margin:0 0 12px">OFFICIAL RECEIPT / STATEMENT OF ACCOUNT · ${esc(S.term)}</p>
 <p><b>Name:</b> ${esc(s.name)} &nbsp; <b>ID:</b> ${esc(s.id)} &nbsp; <b>Course/Year:</b> ${esc(s.course)} / ${s.year}</p>
 <table style="width:100%;border-collapse:collapse"><tr><th>Fee</th><th style="text-align:right">Amount (₱)</th></tr>${a.items.map(i=>`<tr><td>${esc(i.name)}</td><td align="right">${fmt(i.amount)}</td></tr>`).join('')}<tr><td><b>Total assessed</b></td><td align="right"><b>${fmt(tot)}</b></td></tr>${a.down>0?`<tr><td>Down payment required</td><td align="right">${fmt(a.down)}</td></tr>`:''}</table>
 <h3>Payments</h3><table style="width:100%;border-collapse:collapse"><tr><th>Date</th><th>OR no.</th><th>Type</th><th style="text-align:right">Amount (₱)</th></tr>${ps.map(p=>`<tr ${p.id==pid?'style="font-weight:bold;background:#eee"':''}><td>${p.date}</td><td>${esc(p.or)}</td><td>${esc(p.type)}${p.id==pid?' ◄ this receipt':''}</td><td align="right">${fmt(p.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No payments yet</td></tr>'}<tr><td colspan="3"><b>Total paid</b></td><td align="right"><b>${fmt(paid)}</b></td></tr><tr><td colspan="3"><b>Balance</b></td><td align="right"><b>${fmt(Math.max(0,tot-paid))}</b></td></tr></table>
 <div class="box"><b>FINANCE OFFICE</b> (stamp here)<br><br>☐ PAID &nbsp;&nbsp; ☐ PARTIAL &nbsp;&nbsp; ☐ WITH BALANCE<br><br>Received by: ____________________ &nbsp; Date: __________</div></div>`}
/* DEAN */
const postCard=(p,adm)=>`<div class="card ${p.pinned?'pin':''}"><span class="tag">${esc(p.cat)}</span> ${p.pinned?'📌 ':''}<b>${esc(p.title)}</b> <span class="mut">${new Date(p.created).toLocaleDateString()}</span><p style="white-space:pre-wrap;margin:6px 0">${esc(p.body)}</p>${adm?`<button class="btn s" onclick="go(sb.from('posts').update({pinned:${!p.pinned}}).eq('id',${p.id}))">${p.pinned?'Unpin':'Pin'}</button> <button class="btn s d" onclick="go(sb.from('posts').delete().eq('id',${p.id}))">Delete</button>`:''}</div>`;
V.dean_Announcements=()=>`<div class="card"><h2>Post announcement</h2><div class="row"><input id="at" placeholder="Title" style="flex:1"><select id="ac"><option>General</option><option>Academic</option><option>Events</option><option>Deadlines</option><option>Scholarship</option></select><label><input type="checkbox" id="ap"> Pin</label></div><textarea id="ab" placeholder="Message"></textarea><div class="row"><button class="btn p" onclick="if($('#at').value.trim())go(sb.from('posts').insert({title:$('#at').value.trim(),cat:$('#ac').value,pinned:$('#ap').checked,body:$('#ab').value}))">Post</button></div></div>${S.posts.map(p=>postCard(p,1)).join('')}`;
V.dean_Honors=()=>{const rows=S.students.map(s=>({s,g:gw(s.id)})).filter(r=>r.g!=null);
 return`<div class="card"><h2>Auto-suggested honors</h2><p class="mut">Dean's List follows the institutional policy: see the Dean's List tab. Latin honors (4th year): Summa ≤ 1.20, Magna ≤ 1.45, Cum Laude ≤ 1.75. Adjust to school policy.</p>
 <div class="scroll"><table><tr><th>Student</th><th>GWA</th><th>Dean's List</th><th>Latin honors</th></tr>${rows.map(({s,g})=>{const l=latin(s),pd=S.honors.dean.includes(s.id),pl=S.honors.latin[s.id];return`<tr><td>${esc(s.name)}<br><span class="mut">Yr ${s.year}</span></td><td>${g.toFixed(3)}</td><td>${pd?'<span class="ok">Posted</span>':deanOK(s.id)?'<span class="mut">Qualifies — see the Dean\'s List tab</span>':'—'}</td><td>${l?esc(l)+' '+(pl?`<span class="ok">Posted</span> <button class="btn s d" onclick="hon('latin','${s.id}')">Remove</button>`:`<button class="btn s" onclick="hon('latin','${s.id}','${l}')">Post</button>`):'—'}</td></tr>`}).join('')||'<tr><td class="mut">No grades yet.</td></tr>'}</table></div></div>
 <div class="card"><h2>Posted lists</h2><b>Dean's List:</b> ${S.honors.dean.map(i=>esc((stu(i)||{}).name)).join(', ')||'—'}<br><b>Latin honors:</b> ${Object.entries(S.honors.latin).map(([i,l])=>esc((stu(i)||{}).name)+' ('+esc(l)+')').join(', ')||'—'}</div>`};
function hon(kind,id,level){go(level===undefined?sb.from('honors').delete().eq('student_id',id).eq('kind',kind):sb.from('honors').upsert({student_id:id,kind,level}))}
/* FACULTY */
/* STUDENT */
const me_s=()=>S.students.find(s=>s.user_id==me.id);
V.student_Home=()=>{const s=me_s();if(!s)return'<div class="card">No student record is linked to this login.</div>';const g=gw(s.id),ms=mySubs(s),td=DAYS[new Date().getDay()],today=ms.flatMap(x=>(x.sessions||[]).filter(z=>z.day==td).map(z=>({...x,time:z.start+'-'+z.end,room:z.room}))),dn=S.honors.dean.includes(s.id),ln=S.honors.latin[s.id],r=S.req[s.id];
 const pct=g==null?0:Math.max(0,Math.min(100,(3-g)/(3-1.75)*100));
 return`${dn||ln?`<div class="banner">🎉 Congratulations, ${esc(s.name)}! You are on the ${[dn?"Dean's List":'',ln||''].filter(Boolean).join(' and ')}.</div>`:''}
 <div class="card"><h2>${esc(s.name)}</h2><span class="tag">${s.status}</span> <span class="tag">Year ${s.year}</span> <span class="tag">${r?r.status:'not enrolled'}</span>
 <p>Finance: ${s.cleared?'<b class="ok">Cleared ✔</b>':'<b class="warn">Not yet cleared</b> — please pay at the Finance Office.'} · Balance <b>${peso(bal(s))}</b></p></div>
 <div class="card"><h2>Today's classes (${td})</h2>${today.length?today.map(x=>`<div>${esc(x.time)} — <b>${esc(x.code)}</b> ${esc(x.title)} <span class="mut">${esc(x.room)}</span></div>`).join(''):'<span class="mut">No classes today.</span>'}</div>
 <div class="card"><h2>Dean's List progress</h2>${g==null?'<span class="mut">No grades yet.</span>':`<div>GWA <b>${g.toFixed(3)}</b> · TGPA 1.75 or better, no grade lower than 2.00, and no failed, INC or dropped subject</div><div class="bar" style="margin:8px 0"><i style="width:${pct}%"></i></div><span class="mut">${deanOK(s.id)?'You qualify! 🎓':Math.round(pct)+'% of the way there'}</span>`}</div>
 <h2>Announcements</h2>${[...S.posts].sort((a,b)=>b.pinned-a.pinned).map(p=>postCard(p,0)).join('')||'<p class="mut">None.</p>'}`};
V.student_Schedule=()=>{const s=me_s(),ms=s?mySubs(s):[];return`<div class="card"><h2>My subjects &amp; schedule</h2>${ms.length?`<div class="scroll"><table><tr><th>Code</th><th>Subject</th><th>Units</th><th>Schedule</th><th>Room</th></tr>${ms.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.title)}</td><td>${x.units}</td><td>${esc(x.days)} ${esc(x.time)}</td><td>${esc(x.room)}</td></tr>`).join('')}</table></div>`:'<p class="mut">You are not enrolled yet. Use the Enroll tab.</p>'}</div>`};
V.student_Enroll=()=>{const s=me_s();if(!s)return'';const r=S.req[s.id];if(!r&&!pick.length&&s.status=='regular')pick=defLoad(s);
 return`<div class="card"><h2>Enrollment — ${esc(S.term)}</h2>${r?`<p>Request status: <b>${r.status}</b> · Finance: ${s.cleared?'<b class="ok">Cleared</b>':'<b class="warn">Not cleared</b>'}</p><p class="mut">Ask the Registrar to print your enrollment form.</p><hr>`:''}
 <div class="flash"><b>Reminder:</b> pay your fees at the Finance Office. The Registrar will mark you “Finance cleared” once paid.</div>
 <p class="mut">Pick subjects. Subjects with unmet prerequisites are locked.</p>${enrFilter(s)}${enrList(s).map(x=>{const u=unmet(s.id,x);return`<label style="display:block;margin:4px 0;${u.length?'opacity:.55':''}"><input type="checkbox" ${u.length?'disabled':''} ${pick.includes(x.code)?'checked':''} onchange="pick=pick.filter(c=>c!='${x.code}');if(this.checked)pick.push('${x.code}')"> <b>${esc(x.code)}</b> ${esc(x.title)} (${x.units}u) <span class="mut">${esc(x.days)} ${esc(x.time)}</span>${u.length?` <span class="warn">needs ${u.join(', ')}</span>`:''}</label>`}).join('')}
 <p><button class="btn p" onclick="reqEnr('${s.id}')">Submit request</button></p></div>`};
async function reqEnr(id){if(!pick.length)return;const r=await sb.from('requests').upsert({student_id:id,subjects:pick,status:'pending'});if(r.error)return alert(r.error.message);flash='Request sent. Please settle your balance at the Finance Office.';await load();render()}
/* PRINT */
function printForm(id){if(me.role!='registrar')return alert('Only the registrar can print enrollment forms.');const s=stu(id),rows=termSubs(s);
 $('#pfw').style.display='block';$('#pfw').innerHTML=`<div class="noprint" style="max-width:760px;margin:0 auto 10px"><button class="btn p" onclick="window.print()">Print</button> <button class="btn" onclick="$('#pfw').style.display='none'">Close</button></div>
 <div class="pf"><h2 style="text-align:center;margin:0">${esc(S.school)}</h2><p style="text-align:center;margin:0 0 12px">ENROLLMENT FORM · ${esc(S.term)}</p>
 <p><b>Name:</b> ${esc(s.name)} &nbsp; <b>ID:</b> ${esc(s.id)} &nbsp; <b>Course/Year:</b> ${esc(s.course)} / ${s.year} &nbsp; <b>Status:</b> ${s.status} &nbsp; <b>Block:</b> ${esc(s.block||'—')}</p>
 <table style="width:100%;border-collapse:collapse"><tr><th>Code</th><th>Subject</th><th>Units</th><th>Schedule</th><th>Room</th></tr>${rows.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.title)}</td><td>${x.units}</td><td>${esc((x.sessions&&x.sessions.length)?sessTxt(x.sessions):((x.days||'')+' '+(x.time||'')))}</td><td>${esc(x.room)}</td></tr>`).join('')}<tr><td colspan="2" align="right"><b>Total units</b></td><td colspan="3"><b>${rows.reduce((a,x)=>a+(+x.units||0),0)}</b></td></tr></table>
 <div class="box"><b>FOR FINANCE OFFICE</b><br>Total assessed: ${peso(s.tuition)} &nbsp; Amount paid: ______________ &nbsp; Balance: ${peso(bal(s))}<br><br>Received by: ____________________ &nbsp; Date: __________</div>
 <div class="box"><b>FOR REGISTRAR</b> (stamp here)<br><br>☐ ENROLLED &nbsp;&nbsp; ☐ NOT ENROLLED<br><br>Signature: ____________________ &nbsp; Date: __________</div></div>`}
render();start();
</script></body></html>
