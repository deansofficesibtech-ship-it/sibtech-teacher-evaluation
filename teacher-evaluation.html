<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Evaluation – Dean's Office</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1d2433;--paper:#f6f4ef;--card:#fff;--line:#d9d5c9;--navy:#23395b;--ok:#2d7a4f;--warn:#b7791f;--bad:#b3261e;--mut:#6b7280}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Georgia,'Times New Roman',serif;background:var(--paper);color:var(--ink)}
h1,h2,h3,button,input,select,textarea,table,.tab{font-family:system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
main{max-width:1100px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border:1px solid var(--line);background:#ece9df;cursor:pointer;border-radius:6px 6px 0 0}
.tab.on{background:var(--card);border-bottom-color:var(--card);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:6px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:#ece9df}td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#faf8f2}
button{padding:7px 14px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:4px;cursor:pointer}
button.alt{background:#fff;color:var(--navy)}button.del{background:#fff;color:var(--bad);border-color:var(--bad);padding:3px 8px}
input,select,textarea{padding:7px;border:1px solid var(--line);border-radius:4px;font-size:14px;max-width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.badge{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}
.flag td{background:#fdeceb}.mut{color:var(--mut);font-size:13px}
.sec{border:1px solid var(--line);padding:10px;margin:10px 0;border-radius:4px}.sec h3{margin:0 0 6px;font-size:15px}
.ind{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:3px 0}.ind input{width:70px}
#login{max-width:340px;margin:12vh auto}.hide{display:none}.msg{margin:8px 0;font-size:13px}
.po{display:none}.ln{border-bottom:1px solid #888;height:26px}
@media print{.sc{display:none!important}body.pc .sc{display:block!important}.scl{max-height:none!important;overflow:visible!important}header,.tabs,button,.noprint{display:none!important}.po{display:block}body{background:#fff}.card{border:none;padding:0}.sec{break-inside:avoid;border-color:#999}}
</style></head><body>
<div id="login" class="card"><h2>Teacher Evaluation</h2><p class="mut">Dean's Office</p>
<label>Username</label><input id="lu" style="width:100%"><label>Password</label><input id="lp" type="password" style="width:100%">
<p><button onclick="doLogin()">Sign in</button></p><div id="lmsg" class="msg" style="color:var(--bad)"></div></div>

<div id="app" class="hide">
<header><h1>Teacher Evaluation <small style="font-weight:400;opacity:.7">v14</small></h1>
<div class="row" style="align-items:center"><span id="who"></span>
<select id="term" onchange="refresh()"></select>
<button class="alt" onclick="newTerm()" id="ntbtn">New term</button>
<button class="alt" onclick="logout()">Sign out</button></div></header>
<main><div class="tabs" id="tabs"></div><div id="view"></div></main></div>

<script>
// ====== SETUP: paste your Supabase project values ======
const SUPABASE_URL='https://lwciaprylzikjhfffkbx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3Y2lhcHJ5bHppa2poZmZma2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNDkwOTgsImV4cCI6MjExMDcyNTA5OH0.uOgmAWBK34wdqxMEfuxzc88ULwetgM91eM2Ha7FgmCc';
// ========================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SECTIONS=[
['Professional Responsibility',['The teacher starts and ends the class on time.','Attendance is accurately recorded.','The lesson plan/syllabus is available and properly followed.','Learning materials are prepared and well-organized.','Compliance with the Flexi Schedule Policy is observed.']],
['Instructional Delivery',['Learning objectives are clearly stated.','Content is accurate and aligned with the syllabus.','Teaching strategies are appropriate to the learning modality.','Explanations are clear, coherent, and well-structured.','Technology and instructional tools are effectively utilized (if applicable).']],
['Student Engagement and Classroom Management',['Students are actively engaged in learning activities.','The teacher encourages meaningful participation.','Classroom management strategies are effective.','A respectful and inclusive learning environment is maintained.','Student questions are addressed clearly and professionally.']],
['Assessment and Feedback',['Learning activities align with stated objectives.','Assessment methods are appropriate and relevant.','Instructions for tasks and assessments are clear.','Feedback provided is timely, constructive, and actionable.','Monitoring of student progress is evident.']],
['Onsite Classes',['Classroom setup is conducive to learning.','Instructional aids and materials are effectively utilized.','Safety, order, and discipline are properly maintained.']]];
const WEIGHTS={hr:0.30,dean:0.30,program_head:0.30,student:0.10}; // overall weights
const COMPLY=['Class conducted according to the approved schedule','Required contact hours completed','Required documentation submitted','Any deviations are properly documented and reported'];
const NONRENEWAL_MAX=85; // overall rating 85 and below = subject for non-renewal
let me=null,tab='rank',teachers=[],evals=[],detail=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>n==null?'–':Number(n).toFixed(2);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const BANDS=[[5,'Excellent','96-100'],[4,'Very Satisfactory','91-95'],[3,'Satisfactory','86-90'],[2,'Needs Improvement','75-85'],[1,'Unsatisfactory','70-74']];
function band(s){if(s>=96)return['Excellent','b-ok',5];if(s>=91)return['Very Satisfactory','b-ok',4];if(s>=86)return['Satisfactory','b-warn',3];if(s>=75)return['Needs Improvement','b-bad',2];return['Unsatisfactory','b-bad',1]}
// a 1-5 scale entry is converted to the middle of its band; 70-100 is used as is
function toScore(v){if(isNaN(v))return null;if(v>=70&&v<=100)return v;if(v>=1&&v<=5){const m=[72,80,88,93,98],i=Math.min(Math.floor(v)-1,3),f=v-1-i;return +(m[i]+(m[i+1]-m[i])*f).toFixed(2)}return null}
// place 1-5 entries inside their band: near the evaluator's own 70-100 ratings that fall in the same band, otherwise at the middle
function convertAll(vals){const pool=vals.filter(v=>v>=70&&v<=100);const R={5:[96,100],4:[91,95.99],3:[86,90.99],2:[75,85.99],1:[70,74.99]};
 return vals.map(v=>{if(v>=70)return v;if(Number.isInteger(v)&&R[v]){const pe=pool.filter(x=>x>=R[v][0]&&x<=R[v][1]);if(pe.length)return +avg(pe).toFixed(2)}return toScore(v)})}
const isDean=()=>me&&me.role==='dean';
// Supabase returns at most 1000 rows per request, so read every page
async function fetchAll(build){let all=[],from=0;for(;;){const {data,error}=await build().range(from,from+999);if(error)throw error;all=all.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return all}

async function doLogin(){
 const {data,error}=await sb.from('eval_users').select('*').eq('username',$('lu').value.trim()).eq('password',$('lp').value).maybeSingle();
 if(error||!data){$('lmsg').textContent='Wrong username or password.';return}
 me=data;sessionStorage.setItem('te_user',JSON.stringify(me));start();
}
function logout(){sessionStorage.removeItem('te_user');location.reload()}
async function start(){
 $('login').classList.add('hide');$('app').classList.remove('hide');
 $('who').textContent=me.full_name||me.username;
 if(!isDean())$('ntbtn').classList.add('hide');
 const t=[['rank','Rankings']];if(isDean())t.push(['eval','Evaluate'],['csv','Import student CSV'],['teachers','Teachers'],['accts','Accounts']);
 $('tabs').innerHTML=t.map(x=>`<div class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';detail=null;start2()">${x[1]}</div>`).join('');
 await loadTerms();
}
function start2(){
 const t=[['rank','Rankings']];if(isDean())t.push(['eval','Evaluate'],['csv','Import student CSV'],['teachers','Teachers'],['accts','Accounts']);
 $('tabs').innerHTML=t.map(x=>`<div class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';detail=null;start2()">${x[1]}</div>`).join('');render();
}
async function loadTerms(){
 const data=await fetchAll(()=>sb.from('evaluations').select('term').order('id'));
 let terms=[...new Set((data||[]).map(r=>r.term))].sort().reverse();
 const keep=$('term').value;
 if(!terms.length)terms=['1st Sem 2026-2027'];
 $('term').innerHTML=terms.map(t=>`<option>${esc(t)}</option>`).join('');
 if(terms.includes(keep))$('term').value=keep;
 refresh();
}
function newTerm(){const t=prompt('Term name (e.g. 2nd Sem 2026-2027):');if(!t)return;
 const o=document.createElement('option');o.textContent=t;$('term').prepend(o);$('term').value=t;refresh()}
async function refresh(){
 const term=$('term').value;
 const [a,b]=await Promise.all([fetchAll(()=>sb.from('teachers').select('*').order('name').order('id')),fetchAll(()=>sb.from('evaluations').select('*').eq('term',term).order('id'))]);
 teachers=a;evals=b;start2();
}
function compute(){
 const rows=teachers.map(t=>{
  const ev=evals.filter(e=>e.teacher_id===t.id);
  const st=ev.filter(e=>e.source==='student').map(e=>+e.score);
  const dn=ev.filter(e=>e.source==='dean').map(e=>+e.score);
  const ph=ev.filter(e=>e.source==='program_head').map(e=>+e.score);
  const hh=ev.filter(e=>e.source==='hr').map(e=>+e.score);
  const s=avg(st),d=avg(dn),p=avg(ph),h=avg(hh);
  const comp=[['hr',h,'HR'],['dean',d,'Dean'],['program_head',p,'Program head'],['student',s,'Students']];
  const have=comp.filter(c=>c[1]!=null);
  const wsum=have.reduce((a,c)=>a+WEIGHTS[c[0]],0);
  const overall=have.length?have.reduce((a,c)=>a+c[1]*WEIGHTS[c[0]],0)/wsum:null;
  return{t,s,d,p,h,n:st.length,overall,missing:comp.filter(c=>c[1]==null).map(c=>c[2])};
 }).filter(r=>r.overall!=null);
 rows.sort((x,y)=>y.overall-x.overall);
 let rank=0,prev=null;rows.forEach((r,i)=>{if(prev===null||r.overall.toFixed(2)!==prev){rank=i+1;prev=r.overall.toFixed(2)}r.rank=rank});
 return rows;
}
function render(){
 if(tab==='rank')return renderRank();
 if(tab==='eval')return renderEval();
 if(tab==='csv')return renderCsv();
 if(tab==='teachers')return renderTeachers();
 if(tab==='accts')return renderAccts();
}
function renderRank(){
 const rows=compute();
 let h=`<div class="card noprint"><div class="mut">Overall = HR 30% + Dean 30% + Program head 30% + Students 10%. Overall below ${NONRENEWAL_MAX+1} (the 75–85 band and lower) is flagged for non-renewal, but only once all four ratings are in; until then the row shows Incomplete and the overall is computed from the ratings available. Click a row for details.</div></div>
 <div class="card noprint" style="overflow-x:auto"><table><tr><th>Rank</th><th>Teacher</th><th>Program</th><th>HR (30%)</th><th>Dean (30%)</th><th>Program head (30%)</th><th>Students (10%)</th><th>Overall</th><th>Rating</th><th>Status</th></tr>`;
 if(!rows.length)h+=`<tr><td colspan="11" class="mut">No evaluations for this term yet.${isDean()?' Import a student CSV or add an evaluation.':''}</td></tr>`;
 rows.forEach(r=>{const [lbl,cls,num]=band(r.overall),complete=!r.missing.length,flag=complete&&r.overall<NONRENEWAL_MAX+1;
  h+=`<tr class="click ${flag?'flag':''}" onclick="detail='${r.t.id}';renderRank()"><td>${r.rank}</td><td>${esc(r.t.name)}</td><td>${esc(r.t.program)}</td>
  <td class="n">${f2(r.h)}</td><td class="n">${f2(r.d)}</td><td class="n">${f2(r.p)}</td><td class="n">${f2(r.s)} <span class="mut">(${r.n})</span></td><td class="n"><b>${f2(r.overall)}</b></td>
  <td><span class="badge ${cls}">${lbl}</span></td><td>${!complete?`<span class="badge" style="background:#6b7280">Incomplete</span> <span class="mut">needs ${r.missing.join(', ')}</span>`:flag?'<span class="badge b-bad">For non-renewal</span>':'Retain'}</td></tr>`});
 h+='</table></div>';
 if(detail){const t=teachers.find(x=>x.id===detail);const ev=evals.filter(e=>e.teacher_id===detail&&e.source!=='student');
  const sn=evals.filter(e=>e.teacher_id===detail&&e.source==='student').length;
  const rr=rows.find(x=>x.t.id===detail);
  h+=`<div class="card printarea"><h3>${esc(t.name)} – details</h3><div class="mut noprint">${sn} student evaluation(s) this term.</div>
  <p class="po">Program: ${esc(t.program||'')} &nbsp; Term: ${esc($('term').value)}</p>
  ${rr?`<p class="po"><b>Ratings:</b> HR ${f2(rr.h)} &nbsp; Dean ${f2(rr.d)} &nbsp; Program head ${f2(rr.p)} &nbsp; Students ${f2(rr.s)} &nbsp; <b>Overall ${f2(rr.overall)} (${band(rr.overall)[0]})</b></p>`:''}`;
  if(!ev.length)h+='<p class="mut">No HR, dean or program head evaluation yet.</p>';
  ev.forEach(e=>{const d=e.details||{};
   h+=`<div class="sec"><h3>${({dean:'Dean',program_head:'Program head',hr:'HR'})[e.source]}${d.evaluator?' ('+esc(d.evaluator)+')':''} – ${f2(e.score)} <span class="mut">${esc(d.subject||'')} ${esc(d.date||'')}</span> ${isDean()?`<button class="del" onclick="delEval('${e.id}')">Delete</button>`:''}</h3>`;
   if(d.sections)h+=SECTIONS.map((s,i)=>`<div class="ind"><span>${s[0]}</span><b>${f2(d.sections[i])}</b></div>`).join('');
   const bb=band(+e.score);h+=`<div class="ind"><span><b>Overall category</b></span><b>${bb[0]}</b></div>`;
   if(e.remarks)h+=`<p class="noprint"><b>Strengths observed:</b> ${esc(e.remarks)}</p>`;
   const blk=(lbl,txt)=>txt?`<p><b>${lbl}:</b> ${esc(txt)}</p>`:`<div class="po"><b>${lbl}:</b><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>`;
   h+=blk('Areas for improvement',d.improve)+blk('Recommended action plan / intervention',d.plan);
   if(d.comply)h+=`<p class="noprint"><b>Compliance check:</b><br>${COMPLY.map((c,i)=>(d.comply[i]?'&#9745; ':'&#9744; ')+c).join('<br>')}${d.comply_remarks?'<br><i>'+esc(d.comply_remarks)+'</i>':''}</p>`;
   if(d.estimated)h+=`<p class="mut noprint">* Includes 1–5 entries placed inside their band automatically.</p>`;
   if(d.signed||d.acked)h+=`<p class="mut noprint">Evaluator signed: ${esc(d.signed||'–')} &nbsp; Teacher acknowledgment: ${d.acked?'&#9745; acknowledged '+esc(d.ack_date||''):'&#9744; not yet'}</p>`;
   h+='</div>'});
  const scm=evals.filter(e=>e.teacher_id===detail&&e.source==='student'&&e.details&&String(e.details.comment||'').trim());
  if(sn)h+=`<div class="sec sc"><h3>Student comments and suggestions (${scm.length} of ${sn} students wrote one)</h3><div class="scl" style="max-height:420px;overflow:auto">${scm.length?scm.map(e=>{const d=e.details;return `<p style="margin:6px 0">&bull; ${esc(d.comment)} <span class="mut">${[d.subject,d.block,d.year,'rated '+f2(e.score)].filter(Boolean).map(esc).join(' · ')}</span></p>`}).join(''):'<p class="mut">No comments were written.</p>'}</div></div>`;
  h+=`<label class="noprint" style="color:inherit;font-size:14px"><input type="checkbox" style="width:auto" ${document.body.classList.contains('pc')?'checked':''} onchange="document.body.classList.toggle('pc',this.checked)"> Include student comments when printing</label><p><button class="alt" onclick="window.print()">Print</button></p></div>`;}
 $('view').innerHTML=h;
}
async function delEval(id){if(!confirm('Delete this evaluation? You can re-enter it afterwards.'))return;await sb.from('evaluations').delete().eq('id',id);refresh()}
function renderEval(){
 let h=`<div class="card"><h3>Add HR, dean or program head evaluation</h3>
 <div class="row"><div><label>Teacher</label><input id="et" list="tl" placeholder="Type or pick a name"><datalist id="tl">${teachers.map(t=>`<option value="${esc(t.name)}">`).join('')}</datalist></div>
 <div><label>Program</label><input id="ep" placeholder="e.g. BSHM"></div>
 <div><label>Course / subject</label><input id="es"></div>
 <div><label>Date</label><input id="ed" type="date"></div>
 <div><label>Evaluated by</label><select id="eb" onchange="evWho()"><option value="dean">Dean</option><option value="program_head">Program head</option><option value="hr">HR</option></select></div>
 <div id="evw"><label>Program head (choose when Evaluated by = Program head)</label><select id="evn" disabled><option value="">-- choose program head --</option>${teachers.filter(t=>/program head/i.test(t.program||'')).map(t=>`<option value="${esc(t.name)}">${esc(t.name)} (${esc(t.program)})</option>`).join('')}</select></div></div>
 <p class="mut">Rate each indicator 70–100, or use the 1–5 scale (5 = 96–100, 4 = 91–95, 3 = 86–90, 2 = 75–85, 1 = 70–74; a 1–5 entry is placed inside its band, close to your other ratings in that band, or at the middle if there are none). Leave blank for N/A. Section totals, the overall rating and its category are computed automatically.</p>`;
 SECTIONS.forEach((s,i)=>{h+=`<div class="sec"><h3>${s[0]} <span class="mut" id="st${i}"></span></h3>`+s[1].map((q,j)=>`<div class="ind"><span>${q}</span><input type="number" min="1" max="100" step="any" data-s="${i}" oninput="calcForm()"></div>`).join('')+'</div>'});
 h+=`<h3 style="margin-top:18px">Part II: Summary of observation</h3>
 <label>Strengths observed</label><textarea id="er" rows="3" style="width:100%"></textarea>
 <label>Areas for improvement</label><textarea id="ea" rows="3" style="width:100%"></textarea>
 <label>Recommended action plan / intervention</label><textarea id="eap" rows="3" style="width:100%"></textarea>
 <h3 style="margin-top:18px">Part III: Compliance check (Flexi Schedule Policy)</h3>
 ${COMPLY.map((c,i)=>`<div class="ind" style="justify-content:flex-start"><input type="checkbox" id="ec${i}" style="width:auto"><label style="margin:0;color:inherit;font-size:15px" for="ec${i}">${c}</label></div>`).join('')}
 <label>Compliance remarks</label><textarea id="ecr" rows="2" style="width:100%"></textarea>
 <h3 style="margin-top:18px">Part IV: Overall performance rating</h3>
 <p><b>Overall rating: <span id="eo">–</span></b></p><div id="ecat" class="mut" style="font-size:14px"></div>
 <div class="row"><div><label>Evaluator signed on</label><input id="esd" type="date"></div>
 <div><label>Teacher acknowledgment</label><label style="color:inherit;font-size:14px;margin:0"><input type="checkbox" id="eak" style="width:auto"> Teacher acknowledged</label></div>
 <div><label>Acknowledged on</label><input id="ead" type="date"></div></div>
 <p><button onclick="saveEval()">Save evaluation</button></p><div id="emsg" class="msg"></div></div>`;
 $('view').innerHTML=h;
 calcForm();
}
function evWho(){const on=$('eb').value==='program_head';$('evn').disabled=!on;if(!on)$('evn').value=''}
function calcForm(){
 const nodes=[...document.querySelectorAll('input[data-s]')];
 const raw=nodes.map(x=>x.value===''?null:+x.value);
 const idx=raw.map((v,i)=>v==null?-1:i).filter(i=>i>=0);
 const conv=convertAll(idx.map(i=>raw[i]));const sc=nodes.map(()=>null);idx.forEach((i,k)=>sc[i]=conv[k]);
 const secs=SECTIONS.map((_,si)=>avg(nodes.map((n,i)=>+n.dataset.s===si?sc[i]:null).filter(v=>v!=null)));
 secs.forEach((v,i)=>$('st'+i).textContent=v==null?'':'Total: '+f2(v));
 const o=avg(secs.filter(x=>x!=null));
 const est=idx.some(i=>raw[i]<70);
 const b=o==null?null:band(o);
 $('eo').textContent=o==null?'–':f2(o)+' ('+b[0]+')'+(est?' *':'');
 $('ecat').innerHTML=BANDS.map(x=>`${b&&b[2]===x[0]?'&#9745;':'&#9744;'} ${x[0]} – ${x[1]} (${x[2]})`).join(' &nbsp; ')+(est?'<br>* includes 1–5 entries placed inside their band automatically':'');
 return{secs,o,est};
}
async function ensureTeacher(name,prog){
 name=name.trim();let t=teachers.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(t){if(prog&&!t.program){await sb.from('teachers').update({program:prog}).eq('id',t.id)}return t.id}
 const {data,error}=await sb.from('teachers').insert({name,program:prog||''}).select().single();
 if(error)throw error;teachers.push(data);return data.id;
}
async function saveEval(){
 const name=$('et').value.trim();const {secs,o,est}=calcForm();
 if(!name||o==null){$('emsg').textContent='Enter a teacher and at least one rating.';return}
 const inputs=[...document.querySelectorAll('input[data-s]')].map(x=>x.value).filter(v=>v!=='').map(Number);
 if(inputs.some(v=>toScore(v)==null)){$('emsg').textContent='Ratings must be 70-100, or 1-5 on the scale.';return}
 const evn=$('evn').value.trim();
 if($('eb').value==='program_head'){if(!evn){$('emsg').textContent='Choose the program head who evaluated.';return}
}
 try{const id=await ensureTeacher(name,$('ep').value.trim());
  const {error}=await sb.from('evaluations').insert({teacher_id:id,term:$('term').value,source:$('eb').value,score:+o.toFixed(2),remarks:$('er').value,details:{sections:secs,subject:$('es').value,date:$('ed').value,estimated:est,evaluator:$('eb').value==='program_head'?evn:'',improve:$('ea').value,plan:$('eap').value,comply:COMPLY.map((_,i)=>$('ec'+i).checked),comply_remarks:$('ecr').value,signed:$('esd').value,acked:$('eak').checked,ack_date:$('ead').value}});
  if(error)throw error;$('emsg').textContent='Saved.';await refresh();tab='eval';start2();
 }catch(e){$('emsg').textContent='Could not save: '+e.message}
}
function renderCsv(){
 $('view').innerHTML=`<div class="card"><h3>Import student evaluations</h3>
 <p class="mut"><b>Google Forms export (one row per student, up to 9 teachers per row):</b> upload it as it is. The system reads every "NAME OF TEACHER" block, averages that student's 16 ratings for the teacher (1–5 ratings are converted to the 96–100, 91–95... scale), and adds one student rating per teacher. Names already in your Teachers list are matched automatically, even when written slightly differently (order, initials, accents). Any name that is not an exact match is shown to you first, so no teacher is duplicated and no rating is left out.</p>
 <p class="mut"><b>Simple format:</b> columns <b>teacher</b> and <b>rating</b> (and optional <b>program</b>), one row per student.</p>
 <p class="mut">Ratings go into the selected term: <b>${esc($('term').value)}</b>.</p>
 <input type="file" id="cf" accept=".csv,.tsv,.txt"> <button onclick="importCsv()">Import</button>
 
 <div class="msg" id="cm"></div><div id="rv" style="overflow-x:auto"></div></div>${batchesHtml()}`;
}
function batchList(){const g={};evals.filter(e=>e.source==='student').forEach(e=>{const d=e.details||{};const k=d.batch||'old';
 const b=g[k]=g[k]||{k,file:d.file||'Uploaded before upload history was kept',at:d.at||'',ids:[],teachers:new Set()};b.ids.push(e.id);b.teachers.add(e.teacher_id)});
 return Object.values(g).sort((a,b)=>(b.at||'').localeCompare(a.at||''))}
function batchesHtml(){const L=batchList();
 return `<div class="card" style="overflow-x:auto"><h3>Student rating uploads for ${esc($('term').value)}</h3>
 <table><tr><th>Uploaded</th><th>File</th><th>Ratings</th><th>Teachers</th><th></th></tr>
 ${L.map(b=>`<tr><td>${b.at?esc(new Date(b.at).toLocaleString()):'–'}</td><td>${esc(b.file)}</td><td class="n">${b.ids.length}</td><td class="n">${b.teachers.size}</td><td><button class="del" onclick="delBatch('${b.k}')">Delete this upload</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">No student ratings uploaded for this term.</td></tr>'}</table>
 ${L.length?'<p><button class="del" onclick="delBatch(\'ALL\')">Delete ALL student ratings for this term</button></p>':''}</div>`}
async function delBatch(k){
 const L=batchList();const sel=k==='ALL'?L:L.filter(b=>b.k===k);if(!sel.length)return;
 const ids=sel.flatMap(b=>b.ids);const term=$('term').value;
 const what=k==='ALL'?`ALL ${ids.length} student rating(s) for ${term}`:`${ids.length} student rating(s) from "${sel[0].file}"`;
 if(!confirm(`Delete ${what}?\n\nThis cannot be undone. Teachers and the dean, HR and program head evaluations are not affected.`))return;
 $('cm').textContent='Deleting... please wait.';
 try{let done=0;
  if(k==='ALL'){const {error,count}=await sb.from('evaluations').delete({count:'exact'}).eq('term',term).eq('source','student');if(error)throw error;done=count??0}
  else for(let i=0;i<ids.length;i+=100){const {error,count}=await sb.from('evaluations').delete({count:'exact'}).in('id',ids.slice(i,i+100));if(error)throw error;done+=count??0}
  await refresh();tab='csv';start2();
  const left=evals.filter(e=>e.source==='student').length;
  $('cm').textContent=done<ids.length?`Only ${done} of ${ids.length} rating(s) were deleted by the database. ${left} student rating(s) remain - this is usually a Supabase permission setting.`:`Deleted ${done} student rating(s). ${left} student rating(s) remain in this term.`}
 catch(e){alert('Could not delete: '+e.message)}
}
function parseCsv(t,D=','){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
 else if(ch=='"')q=true;else if(ch==D){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
async function importCsv(){
 if(window._impc){$('cm').textContent='Import still running - please wait.';return}
 window._impc=true;$('cm').textContent='Reading file... please wait.';if($('rv'))$('rv').innerHTML='';
 try{await _importCsv()}catch(e){$('cm').textContent='Import failed: '+e.message}finally{window._impc=false}
}
let curBatch=null,pending=null;
const RWORDS={'excellent':5,'outstanding':5,'strongly agree':5,'always':5,'very satisfactory':4,'very good':4,'agree':4,'often':4,'satisfactory':3,'good':3,'neutral':3,'sometimes':3,'fair':2,'needs improvement':2,'disagree':2,'rarely':2,'poor':1,'unsatisfactory':1,'strongly disagree':1,'never':1};
function parseRating(x){const t=String(x??'').trim();if(!t)return NaN;const n=parseFloat(t);if(!isNaN(n))return n;const w=RWORDS[t.toLowerCase().replace(/[^a-z ]/g,'').trim()];return w===undefined?NaN:w}
const normName=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
const SKIPTOK=['JR','SR','MR','MRS','MS','DR','ENGR','PROF','III'];
const nameTokens=x=>normName(x).split(' ').filter(t=>t.length>1&&!SKIPTOK.includes(t));
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
// find the already-listed teacher a name belongs to
function matchTeacher(raw,tl){
 const n=normName(raw),tok=nameTokens(raw),tk=[...tok].sort().join(' ');
 let m=tl.filter(x=>x.n===n);if(m.length===1)return{t:m[0].t,auto:true};if(m.length>1)return{t:m[0].t,auto:false,score:1};
 m=tl.filter(x=>x.tk===tk&&tk);if(m.length===1)return{t:m[0].t,auto:true};if(m.length>1)return{t:m[0].t,auto:false,score:1};
 let best=null,bs=0;
 for(const x of tl){const a=new Set(tok),b=new Set(x.tok);const inter=[...a].filter(z=>b.has(z)).length;let sc=inter/Math.max(a.size,b.size,1);
  if(inter>=2&&(inter===a.size||inter===b.size))sc=Math.max(sc,0.9);
  sc=Math.max(sc,1-lev(n,x.n)/Math.max(n.length,x.n.length,1));if(sc>bs){bs=sc;best=x}}
 return bs>=0.75?{t:best.t,auto:false,score:bs}:{t:null,auto:false,hint:bs>=0.5?best.t:null,score:bs}
}
async function maybeReplaceStudents(){
 const n=evals.filter(e=>e.source==='student').length;
 if(n&&confirm(`This term already has ${n} student rating(s).\n\nOK = replace them with this file (recommended when re-uploading)\nCancel = add this file on top of them`)){
  const {error}=await sb.from('evaluations').delete().eq('term',$('term').value).eq('source','student');if(error)throw error}
}
async function insertBatches(out){for(let i=0;i<out.length;i+=300){const {error}=await sb.from('evaluations').insert(out.slice(i,i+300));if(error)throw error}}
async function _importCsv(){
 const f=$('cf').files[0];if(!f){$('cm').textContent='Choose a CSV file first.';return}
 curBatch={batch:Date.now().toString(36),file:f.name,at:new Date().toISOString()};
 let text=(await f.text()).replace(/^\uFEFF/,'');
 const sample=text.slice(0,4000);const D=(sample.split('\t').length>sample.split(',').length)?'\t':',';
 const rows=parseCsv(text,D);const head=rows.shift().map(x=>x.trim().toLowerCase());
 const hl=head.map(x=>x.replace(/\s+/g,' '));
 const byT={};const stats={responses:0,found:0,unreadable:0,badCells:0,samples:new Set()};
 if(hl.some(h=>h.startsWith('name of teacher'))){
  const starts=hl.map((h,i)=>h.startsWith('name of teacher')?i:-1).filter(i=>i>=0);
  const catOf=h=>/^mastery of the subject matter\s*:/.test(h)?'mastery':/^communication skills\s*:/.test(h)?'communication':/^classroom management\s*:/.test(h)?'classroom':null;
  const blocks=starts.map((st,k)=>{const end=k+1<starts.length?starts[k+1]:hl.length;const rate=[];let subj=-1,com=-1;
   for(let i=st+1;i<end;i++){const h=hl[i];if(h.startsWith('subject taught'))subj=i;else if(catOf(h))rate.push([i,catOf(h)]);else if(h.startsWith('comments'))com=i}
   return{st,subj,rate,com}});
  const yi=hl.indexOf('year level'),bi=hl.indexOf('block');
  const avgOf=a=>a.length?+(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2):null;
  for(const r of rows){if(!r.some(c=>String(c).trim()))continue;stats.responses++;
   for(const b of blocks){const name=(r[b.st]||'').trim();if(!name)continue;
    const sc=[];b.rate.forEach(([i,c])=>{const raw=String(r[i]??'').trim();if(!raw)return;const v=toScore(parseRating(raw));if(v==null){stats.badCells++;if(stats.samples.size<6)stats.samples.add(raw)}else sc.push({c,v})});
    const k=normName(name);(byT[k]=byT[k]||{name,prog:'',recs:[]});
    if(!sc.length){stats.unreadable++;byT[k].noscore=(byT[k].noscore||0)+1;continue}
    const cat=c=>avgOf(sc.filter(x=>x.c===c).map(x=>x.v));stats.found++;
    byT[k].recs.push({score:avgOf(sc.map(x=>x.v)),details:{subject:b.subj>=0?(r[b.subj]||'').trim():'',block:bi>=0?(r[bi]||'').trim():'',year:yi>=0?(r[yi]||'').trim():'',comment:b.com>=0?(r[b.com]||'').trim():'',mastery:cat('mastery'),communication:cat('communication'),classroom:cat('classroom')}})}}
 }else{
  const ti=head.indexOf('teacher'),ri=head.findIndex(h=>h==='rating'||h==='score'),pi=head.indexOf('program');
  if(ti<0||ri<0){$('cm').textContent='Header must include "teacher" and "rating" (or be a Google Forms export with "NAME OF TEACHER" columns).';return}
  const groups={};
  for(const r of rows){if(!r.some(c=>String(c).trim()))continue;stats.responses++;const name=(r[ti]||'').trim(),v=parseRating(r[ri]);
   if(!name)continue;if(toScore(v)==null){stats.unreadable++;stats.badCells++;if(stats.samples.size<6)stats.samples.add(String(r[ri]));continue}
   const k=normName(name);(groups[k]=groups[k]||{name,prog:pi>=0?(r[pi]||'').trim():'',vals:[]}).vals.push(v)}
  for(const k in groups){const g=groups[k];byT[k]={name:g.name,prog:g.prog,recs:convertAll(g.vals).map(sc=>({score:sc,details:{}}))};stats.found+=g.vals.length}
 }
 if(!Object.keys(byT).length){$('cm').textContent='No teacher ratings found in this file.';return}
 const tl=teachers.map(t=>({t,n:normName(t.name),tok:nameTokens(t.name),tk:nameTokens(t.name).sort().join(' ')}));
 const map={},review=[];
 for(const k in byT){const m=matchTeacher(byT[k].name,tl);if(m.auto)map[k]=m.t.id;else review.push({k,m})}
 pending={byT,stats,map,review};
 if(!review.length)return runImport();
 const opts=teachers.slice().sort((a,b)=>a.name.localeCompare(b.name));
 $('cm').textContent=`${Object.keys(byT).length-review.length} teacher name(s) matched your list automatically. Please check the ${review.length} below so no teacher is duplicated and no rating is left out.`;
 $('rv').innerHTML=`<table><tr><th>Name in the file</th><th>Ratings</th><th>Use this teacher</th></tr>${review.map((x,i)=>{const g=byT[x.k],m=x.m,sug=m.t||null;
  return `<tr><td>${esc(g.name)}<div class="mut">${m.t?'looks like '+esc(m.t.name)+' ('+Math.round(m.score*100)+'% similar)':m.hint?'closest: '+esc(m.hint.name):'no similar name in your list'}</div></td><td class="n">${g.recs.length}</td>
  <td><select id="mp${i}" style="max-width:340px">${sug?`<option value="T:${sug.id}" selected>${esc(sug.name)} (suggested)</option>`:''}<option value="NEW"${sug?'':' selected'}>Create as a new teacher</option><option value="SKIP">Skip these ratings</option>${opts.filter(t=>!sug||t.id!==sug.id).map(t=>`<option value="T:${t.id}">${esc(t.name)}</option>`).join('')}</select></td></tr>`}).join('')}</table>
  <p><button onclick="confirmMap()">Confirm and import</button></p>`;
}
async function confirmMap(){
 if(window._impc2||!pending)return;window._impc2=true;
 try{$('cm').textContent='Importing... please wait and do not click again.';
  pending.review.forEach((x,i)=>{const v=$('mp'+i).value;pending.map[x.k]=v==='NEW'?'NEW':v==='SKIP'?null:v.slice(2)});
  await runImport()}catch(e){$('cm').textContent='Import failed: '+e.message}finally{window._impc2=false}
}
async function runImport(){
 const {byT,stats,map}=pending;const term=$('term').value;
 await maybeReplaceStudents();
 const out=[];const tids=new Set();let skipped=0,created=0;
 for(const k in byT){const g=byT[k];let id=map[k];
  if(id==null){skipped+=g.recs.length;continue}
  if(id==='NEW'){const before=teachers.length;id=await ensureTeacher(g.name,g.prog);if(teachers.length>before)created++}
  tids.add(id);g.recs.forEach(x=>out.push({teacher_id:id,term,source:'student',score:x.score,details:{...x.details,...curBatch}}))}
 await insertBatches(out);
 const comments=out.filter(x=>String(x.details.comment||'').trim()).length;
 let msg=`Imported ${out.length} rating(s) from ${stats.responses} response(s) for ${tids.size} teacher(s), with ${comments} comment(s).`;
 if(created)msg+=` ${created} new teacher(s) created.`;
 if(skipped)msg+=` ${skipped} rating(s) skipped because you chose Skip.`;
 if(stats.unreadable){const nm=Object.values(byT).filter(g=>g.noscore).map(g=>`${g.name} (${g.noscore})`);msg+=` ${stats.unreadable} teacher block(s) had no readable ratings${nm.length?': '+nm.slice(0,10).join('; ')+(nm.length>10?'; ...':''):''}.`}
 if(stats.badCells)msg+=` ${stats.badCells} rating cell(s) could not be read (for example: ${[...stats.samples].map(x=>'"'+x+'"').join(', ')}).`;
 pending=null;await refresh();tab='csv';start2();$('cm').textContent=msg;
}
function renderTeachers(){
 $('view').innerHTML=`<div class="card"><h3>Add teachers and programs</h3>
 <p class="mut">Upload a CSV with columns <b>name</b> and <b>program</b>, or paste rows copied from Excel / Google Sheets (name in the first column, program in the second). Existing teachers just get their program updated.</p>
 <input type="file" id="tf" accept=".csv"> <button onclick="importTeachers(true)">Import file</button>
 <label>Or paste here</label><textarea id="tp" rows="6" style="width:100%" placeholder="Jatulan, Mary Joy[TAB]BSHM"></textarea>
 <p><button onclick="importTeachers(false)">Import pasted rows</button></p><div class="msg" id="tm"></div></div>
 <div class="card" style="overflow-x:auto"><h3>Teachers (${teachers.length})</h3><table><tr><th>Name</th><th>Program</th><th></th></tr>
 ${teachers.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.program)}</td><td><button class="alt" onclick="editProg('${t.id}')">Edit program</button> <button class="del" onclick="delTeacher('${t.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="3" class="mut">No teachers yet.</td></tr>'}</table></div>`;
}
async function importTeachers(f){
 if(window._imp){$('tm').textContent='Import still running - please wait.';return}
 window._imp=true;$('tm').textContent='Importing... please wait and do not click again.';
 try{await _importTeachers(f)}finally{window._imp=false}
}
async function _importTeachers(fromFile){
 let text;if(fromFile){const f=$('tf').files[0];if(!f){$('tm').textContent='Choose a CSV file first.';return}text=await f.text()}else text=$('tp').value;
 text=text.replace(/^\uFEFF/,'');if(!text.trim()){$('tm').textContent='Nothing to import.';return}
 let rows=text.includes('\t')?text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t')):parseCsv(text);
 if(rows.length&&/^(name|teacher|teacher name|faculty)$/i.test((rows[0][0]||'').trim()))rows.shift();
 const seen={};let add=0,upd=0;
 try{for(const r of rows){const name=(r[0]||'').trim(),prog=(r[1]||'').trim();if(!name||seen[name.toLowerCase()])continue;seen[name.toLowerCase()]=1;
   const t=teachers.find(x=>x.name.toLowerCase()===name.toLowerCase());
   if(t){if(prog&&t.program!==prog){const {error}=await sb.from('teachers').update({program:prog}).eq('id',t.id);if(error)throw error;upd++}}
   else{const {data,error}=await sb.from('teachers').insert({name,program:prog}).select().single();if(error)throw error;teachers.push(data);add++}}
  await refresh();tab='teachers';start2();$('tm').textContent=`Added ${add} new teacher(s), updated ${upd}.`;
 }catch(e){$('tm').textContent='Import failed: '+e.message}
}
async function editProg(id){const t=teachers.find(x=>x.id===id);const v=prompt('Program for '+t.name+':',t.program||'');if(v===null)return;await sb.from('teachers').update({program:v.trim()}).eq('id',id);await refresh();tab='teachers';start2()}
async function delTeacher(id){const t=teachers.find(x=>x.id===id);if(!confirm('Delete '+t.name+' and ALL of their evaluations (every term)?'))return;await sb.from('teachers').delete().eq('id',id);await refresh();tab='teachers';start2()}

 const {data}=await sb.from('eval_users').select('*').order('username');
 $('view').innerHTML=`<div class="card"><h3>Create a view-only account</h3><div class="row">
 <div><label>Name</label><input id="an"></div><div><label>Username</label><input id="au"></div><div><label>Password</label><input id="ap"></div>
 <button onclick="addAcct()">Create account</button></div><div class="msg" id="am"></div></div>
 <div class="card"><table><tr><th>Name</th><th>Username</th><th>Password</th><th>Role</th><th></th></tr>${(data||[]).map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td>${esc(u.password)}</td><td>${u.role==='dean'?'Dean\'s Office':'View only'}</td><td>${u.role==='viewer'?`<button class="del" onclick="delAcct('${u.id}')">Delete</button>`:''}</td></tr>`).join('')}</table></div>`;
